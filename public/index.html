<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Resolve the theme before first paint so there is no flash of the
         wrong theme. Mirrors resolve() in src/theme.tsx. -->
    <script>
      (function () {
        var theme = "dark";
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark") theme = stored;
          else if (window.matchMedia("(prefers-color-scheme: light)").matches)
            theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <!-- Self-hosted variable fonts (one file per family, Latin preloaded):
         no third-party request in the critical path -->
    <link rel="preload" href="%PUBLIC_URL%/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%PUBLIC_URL%/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
