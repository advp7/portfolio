<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Resolve the theme before first paint so there is no flash of the
         wrong theme. Mirrors resolve() in src/theme.tsx. -->
    <script>
      (function () {
        var theme = "dark";
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark") theme = stored;
          else if (window.matchMedia("(prefers-color-scheme: light)").matches)
            theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#060911" />
    <meta
      name="description"
      content="Advaith Praveen — frontend-leaning full-stack engineer. React &amp; React Native on the frontend, Java and Python services behind them, and AI agents for customer experience. Work used by teams at Swiggy, Zomato and Edelweiss."
    />
    <meta name="author" content="Advaith Praveen" />
    <link rel="canonical" href="https://advp7.github.io/portfolio/" />

    <!-- Open Graph (LinkedIn, Slack, etc.) -->

    <meta property="og:url" content="https://advp7.github.io/portfolio/" />
    <meta property="og:title" content="Advaith Praveen — Senior Frontend Engineer, Full-Stack &amp; AI" />
    <meta
      property="og:description"
      content="Frontend-leaning full-stack engineer. React &amp; React Native on the frontend, Java and Python services behind them, and AI agents for customer experience. Work used by teams at Swiggy, Zomato and Edelweiss."
    />
    <!-- og:image must be an ABSOLUTE url — crawlers cannot resolve relative paths -->
    <meta
      property="og:image"
      content="https://advp7.github.io/portfolio/og-image.png"
    />
    <meta property="og:image:width" content="1200" />

    <!-- Twitter card -->

    <meta name="twitter:title" content="Advaith Praveen — Senior Frontend Engineer, Full-Stack &amp; AI" />
    <meta
      name="twitter:description"
      content="Frontend-leaning full-stack engineer. React &amp; React Native, Java and Python services, and AI agents for customer experience."
    />
    <meta
      name="twitter:image"

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  </head>
