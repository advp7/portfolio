<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 290" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="448" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0e1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="448" height="290" fill="url(#bg)"/>
  <rect width="448" height="290" fill="url(#glow)"/>

  <!-- chat window -->
  <rect x="84" y="38" width="280" height="214" rx="16" fill="#0d1526" stroke="rgba(255,255,255,0.12)"/>
  <!-- window header -->
  <rect x="84" y="38" width="280" height="42" rx="16" fill="#101b30"/>
  <rect x="84" y="64" width="280" height="16" fill="#101b30"/>
  <circle cx="110" cy="59" r="11" fill="url(#accent)"/>
  <path d="M106.5 59.5l2.5 2.5 4.5-5" stroke="#04121b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="64" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Ellie</text>
  <circle cx="342" cy="59" r="4" fill="#2dd4bf"/>

  <!-- incoming bubble -->
  <rect x="100" y="96" width="168" height="30" rx="10" fill="rgba(255,255,255,0.08)"/>
  <rect x="112" y="107" width="110" height="7" rx="3.5" fill="rgba(241,245,249,0.55)"/>

  <!-- outgoing bubble -->
  <rect x="196" y="136" width="152" height="30" rx="10" fill="url(#accent)" opacity="0.9"/>
  <rect x="208" y="147" width="96" height="7" rx="3.5" fill="#04121b" opacity="0.7"/>

  <!-- incoming bubble 2 (typing) -->
  <rect x="100" y="176" width="92" height="28" rx="10" fill="rgba(255,255,255,0.08)"/>
  <circle cx="122" cy="190" r="4" fill="#38bdf8"/>
  <circle cx="138" cy="190" r="4" fill="#38bdf8" opacity="0.65"/>
  <circle cx="154" cy="190" r="4" fill="#38bdf8" opacity="0.35"/>

  <!-- input bar -->
  <rect x="100" y="216" width="248" height="24" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="336" cy="228" r="8" fill="url(#accent)"/>
  <path d="M333 228h5.5m0 0l-2.2-2.2m2.2 2.2l-2.2 2.2" stroke="#04121b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sparkles -->
  <path d="M394 84l3.2 8 8 3.2-8 3.2-3.2 8-3.2-8-8-3.2 8-3.2z" fill="url(#accent)" opacity="0.9"/>
  <path d="M64 190l2.2 5.6 5.6 2.2-5.6 2.2-2.2 5.6-2.2-5.6-5.6-2.2 5.6-2.2z" fill="#2dd4bf" opacity="0.6"/>
  <path d="M52 84l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#38bdf8" opacity="0.5"/>
</svg>
